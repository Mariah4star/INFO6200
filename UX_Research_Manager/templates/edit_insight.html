{% extends "base.html" %}

{% block content %}
<div style="max-width: 800px; margin: 0 auto;">
    <a href="/insights" style="color: var(--royal-blue); text-decoration: none; margin-bottom: 1rem; display: inline-block;">← Back to Insights</a>
    
    <h1>Edit Insight</h1>
    
    <div class="card">
        <form method="POST" style="display: flex; flex-direction: column; gap: 1rem;">
            <div class="form-group">
                <label for="title">Insight Title</label>
                <input type="text" id="title" name="title" value="{{ insight.title }}" required style="width: 100%; padding: 0.5rem; border: 1px solid var(--soft-blue); border-radius: 4px;">
            </div>
            
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" required style="width: 100%; padding: 0.5rem; border: 1px solid var(--soft-blue); border-radius: 4px; min-height: 120px;">{{ insight.description }}</textarea>
            </div>
            
            <div class="form-group">
                <label for="persona_id">Persona (Optional)</label>
                <select id="persona_id" name="persona_id" style="width: 100%; padding: 0.5rem; border: 1px solid var(--soft-blue); border-radius: 4px;">
                    <option value="">Select a persona...</option>
                    {% for persona in personas %}
                    <option value="{{ persona.id }}" {% if insight.persona_id == persona.id %}selected{% endif %}>{{ persona.name }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label for="journey_stage">Journey Stage (Optional)</label>
                <select id="journey_stage" name="journey_stage" style="width: 100%; padding: 0.5rem; border: 1px solid var(--soft-blue); border-radius: 4px;">
                    <option value="">Select a stage...</option>
                    <option value="Awareness" {% if insight.journey_stage == 'Awareness' %}selected{% endif %}>Awareness</option>
                    <option value="Consideration" {% if insight.journey_stage == 'Consideration' %}selected{% endif %}>Consideration</option>
                    <option value="Decision" {% if insight.journey_stage == 'Decision' %}selected{% endif %}>Decision</option>
                    <option value="Retention" {% if insight.journey_stage == 'Retention' %}selected{% endif %}>Retention</option>
                    <option value="Advocacy" {% if insight.journey_stage == 'Advocacy' %}selected{% endif %}>Advocacy</option>
                </select>
            </div>
            
            <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                <button type="submit" class="btn btn-success" style="flex: 1;">Save Changes</button>
                <button type="button" class="btn btn-secondary" onclick="window.location.href='/insights/{{ insight.id }}'" style="flex: 1;">Cancel</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
