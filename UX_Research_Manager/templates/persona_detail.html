{% extends "base.html" %}

{% block content %}
<div style="max-width: 800px; margin: 0 auto;">
    <a href="/personas" style="color: var(--royal-blue); text-decoration: none; margin-bottom: 1rem; display: inline-block;">← Back to Personas</a>
    
    <div class="card">
        <h1 style="margin-top: 0;">{{ persona.name }}</h1>
        
        <div class="meta" style="margin: 1rem 0;">Created: {{ persona.timestamp }}</div>
        
        <h2>Description</h2>
        <p style="line-height: 1.6; white-space: pre-wrap;">{{ persona.description }}</p>
        
        <div style="margin-top: 2rem; display: flex; gap: 1rem;">
            <button class="btn btn-secondary" onclick="editPersona('{{ persona.id }}')">Edit</button>
            <button class="btn" onclick="deletePersona('{{ persona.id }}')" style="background-color: #e74c3c;">Delete</button>
        </div>
    </div>
</div>

<script>
function editPersona(id) {
    window.location.href = '/personas/' + id + '/edit';
}

function deletePersona(id) {
    if (confirm('Are you sure you want to delete this persona? This cannot be undone.')) {
        fetch(`/personas/${id}/delete`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            }
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                window.location.href = '/personas';
            } else {
                alert('Error: ' + data.message);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Error deleting persona');
        });
    }
}
</script>
{% endblock %}
