{% extends "base.html" %}

{% block content %}
<div style="max-width: 520px; margin: 0 auto;">
    <h1>Create Account</h1>
    <div class="card">
        <form method="POST" action="{{ url_for('register') }}" style="display: flex; flex-direction: column; gap: 1rem;">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autocomplete="email" style="width: 100%; padding: 0.5rem; border: 1px solid var(--soft-blue); border-radius: 4px;">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password" style="width: 100%; padding: 0.5rem; border: 1px solid var(--soft-blue); border-radius: 4px;">
                <small style="color: #666;">Use at least 8 characters.</small>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required minlength="8" autocomplete="new-password" style="width: 100%; padding: 0.5rem; border: 1px solid var(--soft-blue); border-radius: 4px;">
            </div>

            <button type="submit" class="btn btn-success">Register</button>
        </form>
    </div>
    <p style="text-align: center; margin-top: 1rem;">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
