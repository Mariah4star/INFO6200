{% extends "base.html" %}

{% block content %}
<div style="max-width: 800px; margin: 0 auto;">
    <a href="/personas" style="color: var(--royal-blue); text-decoration: none; margin-bottom: 1rem; display: inline-block;">← Back to Personas</a>
    
    <h1>Edit Persona</h1>
    
    <div class="card">
        <form method="POST" style="display: flex; flex-direction: column; gap: 1rem;">
            <div class="form-group">
                <label for="name">Persona Name</label>
                <input type="text" id="name" name="name" value="{{ persona.name }}" required style="width: 100%; padding: 0.5rem; border: 1px solid var(--soft-blue); border-radius: 4px;">
            </div>
            
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" required style="width: 100%; padding: 0.5rem; border: 1px solid var(--soft-blue); border-radius: 4px; min-height: 120px;">{{ persona.description }}</textarea>
            </div>
            
            <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                <button type="submit" class="btn btn-success" style="flex: 1;">Save Changes</button>
                <button type="button" class="btn btn-secondary" onclick="window.location.href='/personas/{{ persona.id }}'" style="flex: 1;">Cancel</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
