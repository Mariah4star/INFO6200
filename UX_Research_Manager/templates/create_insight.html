{% extends "base.html" %}

{% block content %}
<h1>Create New Insight</h1>

<div class="card" style="max-width: 600px; margin: 0 auto;">
    <form method="POST" action="/insights" style="display: flex; flex-direction: column; gap: 1rem;">
        <div class="form-group">
            <label for="title">Insight Title</label>
            <input type="text" id="title" name="title" required style="width: 100%; padding: 0.5rem; border: 1px solid var(--soft-blue); border-radius: 4px;">
        </div>
        
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" required style="width: 100%; padding: 0.5rem; border: 1px solid var(--soft-blue); border-radius: 4px; min-height: 120px;"></textarea>
        </div>
        
        <div class="form-group">
            <label for="persona_id">Persona (Optional)</label>
            <select id="persona_id" name="persona_id" style="width: 100%; padding: 0.5rem; border: 1px solid var(--soft-blue); border-radius: 4px;">
                <option value="">Select a persona...</option>
                {% for persona in personas %}
                <option value="{{ persona.id }}">{{ persona.name }}</option>
                {% endfor %}
            </select>
            {% if personas|length == 0 %}
            <p style="margin-top: 0.5rem; color: #666;">No personas yet. Create one first to link it to this insight.</p>
            {% endif %}
            <button type="button" class="btn btn-secondary" onclick="window.location.href='/personas/new'" style="margin-top: 0.5rem;">+ Create Persona</button>
        </div>
        
        <div class="form-group">
            <label for="journey_stage">Journey Stage (Optional)</label>
            <select id="journey_stage" name="journey_stage" style="width: 100%; padding: 0.5rem; border: 1px solid var(--soft-blue); border-radius: 4px;">
                <option value="">Select a stage...</option>
                <option value="Awareness">Awareness</option>
                <option value="Consideration">Consideration</option>
                <option value="Decision">Decision</option>
                <option value="Retention">Retention</option>
                <option value="Advocacy">Advocacy</option>
            </select>
        </div>
        
        <div style="display: flex; gap: 1rem; margin-top: 1rem;">
            <button type="submit" class="btn btn-success" style="flex: 1;">Create Insight</button>
            <button type="button" class="btn btn-secondary" onclick="window.location.href='/insights'" style="flex: 1;">Cancel</button>
        </div>
    </form>
</div>
{% endblock %}
