{% extends "base.html" %}

{% block content %}
<div style="max-width: 520px; margin: 0 auto;">
    <h1>Change Password</h1>
    <div class="card">
        <form method="POST" action="{{ url_for('change_password') }}" style="display: flex; flex-direction: column; gap: 1rem;">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autocomplete="email" style="width: 100%; padding: 0.5rem; border: 1px solid var(--soft-blue); border-radius: 4px;">
            </div>

            <div class="form-group">
                <label for="current_password">Current Password</label>
                <input type="password" id="current_password" name="current_password" required autocomplete="current-password" style="width: 100%; padding: 0.5rem; border: 1px solid var(--soft-blue); border-radius: 4px;">
            </div>

            <div class="form-group">
                <label for="new_password">New Password</label>
                <input type="password" id="new_password" name="new_password" required minlength="8" autocomplete="new-password" style="width: 100%; padding: 0.5rem; border: 1px solid var(--soft-blue); border-radius: 4px;">
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm New Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required minlength="8" autocomplete="new-password" style="width: 100%; padding: 0.5rem; border: 1px solid var(--soft-blue); border-radius: 4px;">
            </div>

            <button type="submit" class="btn">Update Password</button>
        </form>
    </div>
    <p style="text-align: center; margin-top: 1rem;">Back to login? <a href="{{ url_for('login') }}">Log In</a></p>
</div>
{% endblock %}
