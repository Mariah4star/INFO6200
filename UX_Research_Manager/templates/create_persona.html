{% extends "base.html" %}

{% block content %}
<h1>Create New Persona</h1>

<div class="card" style="max-width: 600px; margin: 0 auto;">
    <form method="POST" action="/personas" style="display: flex; flex-direction: column; gap: 1rem;">
        {% if next_url %}
        <input type="hidden" name="next" value="{{ next_url }}">
        {% endif %}
        <div class="form-group">
            <label for="name">Persona Name</label>
            <input type="text" id="name" name="name" required style="width: 100%; padding: 0.5rem; border: 1px solid var(--soft-blue); border-radius: 4px;">
        </div>
        
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" required style="width: 100%; padding: 0.5rem; border: 1px solid var(--soft-blue); border-radius: 4px; min-height: 120px;"></textarea>
        </div>
        
        <div style="display: flex; gap: 1rem; margin-top: 1rem;">
            <button type="submit" class="btn btn-success" style="flex: 1;">Create Persona</button>
            <button type="button" class="btn btn-secondary" onclick="window.location.href='/personas'" style="flex: 1;">Cancel</button>
        </div>
    </form>
</div>
{% endblock %}
