{% extends "base.html" %}

{% block content %}
<div style="max-width: 520px; margin: 0 auto;">
    <h1>Log In</h1>
    <div class="card">
        <form method="POST" action="{{ url_for('login') }}" style="display: flex; flex-direction: column; gap: 1rem;">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autocomplete="email" style="width: 100%; padding: 0.5rem; border: 1px solid var(--soft-blue); border-radius: 4px;">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password" style="width: 100%; padding: 0.5rem; border: 1px solid var(--soft-blue); border-radius: 4px;">
            </div>

            <button type="submit" class="btn">Log In</button>
        </form>
    </div>
    <p style="text-align: center; margin-top: 1rem;">Need an account? <a href="{{ url_for('register') }}">Register</a></p>
</div>
{% endblock %}
